{% extends "base.html" %}
{% block titulo %}Agenda{% endblock %}
{% block conteudo %}
<div class="cabecalho">
  <h1>Agenda</h1>
  <a class="btn btn-primario" href="{{ url_for('agendamentos.novo') }}">+ Novo agendamento</a>
</div>

<form class="filtros" method="get">
  <label>Data <input type="date" name="data" value="{{ data }}"></label>
  <label>Status
    <select name="status">
      <option value="">Todos</option>
      <option value="agendado" {{ 'selected' if status == 'agendado' }}>Agendado</option>
      <option value="concluido" {{ 'selected' if status == 'concluido' }}>Concluído</option>
      <option value="cancelado" {{ 'selected' if status == 'cancelado' }}>Cancelado</option>
    </select>
  </label>
  <button class="btn" type="submit">Filtrar</button>
  {% if data or status %}<a class="btn btn-link" href="{{ url_for('agendamentos.listar') }}">Limpar</a>{% endif %}
</form>

{% if agendamentos %}
  {% include "agendamentos/_tabela.html" %}
{% else %}
  <p class="vazio">Nenhum agendamento encontrado.</p>
{% endif %}
{% endblock %}
