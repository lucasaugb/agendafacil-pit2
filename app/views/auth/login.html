{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<section class="login-caixa">
  <h1>✂ AgendaFácil</h1>
  <p class="sub">Agendamentos para barbearias e salões</p>
  <form method="post" class="form" data-validar novalidate>
    <label>E-mail
      <input type="email" name="email" value="{{ email }}" required autofocus placeholder="seu@email.com">
    </label>
    <label>Senha
      <input type="password" name="senha" required placeholder="Sua senha">
    </label>
    <button class="btn btn-primario btn-largo" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
