{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<h1>{{ titulo }}</h1>
<form method="post" class="form caixa" data-validar novalidate>
  <label>Nome do serviço *
    <input type="text" name="nome" value="{{ servico.nome or '' }}" required minlength="2" maxlength="80">
  </label>
  <label>Descrição
    <input type="text" name="descricao" value="{{ servico.descricao or '' }}" maxlength="200">
  </label>
  <div class="linha">
    <label>Preço (R$) *
      <input type="number" name="preco" value="{{ servico.preco if servico.preco is not none else '' }}" required min="0" step="0.01">
    </label>
    <label>Duração (minutos) *
      <input type="number" name="duracao_min" value="{{ servico.duracao_min or '' }}" required min="5" max="480" step="5">
    </label>
  </div>
  <p class="dica">* campos obrigatórios</p>
  <div class="botoes">
    <a class="btn" href="{{ url_for('servicos.listar') }}">Cancelar</a>
    <button class="btn btn-primario" type="submit">Salvar</button>
  </div>
</form>
{% endblock %}
